name: Refresh profile cards

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-profile.py
      - .github/workflows/profile.yml

permissions: {}

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Fetch public data and render cards
        run: python3 scripts/update-profile.py
      - name: Commit generated files only
        run: |
          git add assets/profile-data.json assets/github-dark.svg assets/github-dark-mobile.svg assets/github-light.svg assets/github-light-mobile.svg assets/chess-dark.svg assets/chess-dark-mobile.svg assets/chess-light.svg assets/chess-light-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public profile cards"
          git push
